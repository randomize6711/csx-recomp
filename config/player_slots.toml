# Player slot audit input (tools/slot_audit.py): every structure, constant and protocol field tied to the 17 player
# slots, from analysis/player_slots_engine_server.md, _engine_client.md, _game_dll.md and docs/player_slots_plan.md.
# The audit finds the instructions that reference each one in the code xbe_recomp generates (its --listing) and
# writes analysis/player_slots_inventory.json. Addresses are guest VAs of assets/default.xbe (the sha256 in game.toml).
#
# layout:   "verified" = base, stride and count read from the code; "inferred" = from HL1 / CS source structure
# plan:     relocate      a standalone table moved to a larger one (Checkpoint 2)
#           relocate-out  an array embedded in a larger struct moved out to its own table (the frame ring)
#           grow-object   an array inside a heap or static object whose layout has to grow or be split
#           field         a per-player field inside another per-player record
#           scales        sized from maxclients at run time: listed to show it was checked
# fields/code: offsets [lo, hi) off a base register in the code ranges that handle the object (inferred matches).
# A table's references are the instructions with an absolute address in [base, base + stride * count + slack); slack
# (default one element) catches pointers to a field of the element past the end, as loop ends use.

[audit]
# code the scans cover: the engine, the front end and its voice code, the game DLL, the client HUD
ranges = [[0x12000, 0xBF000, "engine"], [0xBF000, 0x116000, "ui"], [0x116000, 0x18B300, "game"],
          [0x18B300, 0x1E0000, "hud"]]
# constants whose compares and loads are candidates for a player count (17, its neighbours and 32)
count_constants = [0x10, 0x11, 0x12, 0x20, 0x21]

# --- engine server ---

[[table]]
name = "sv_truepositions"
area = "engine server"
what = "lag compensation positions, one per client (SV_SetupMove)"
base = 0x4E46C0
stride = 0x58
count = 17
also = [0x4E4668]                  # base - 0x58: indexed by client number from 1
plan = "relocate"
layout = "verified"
source = "player_slots_engine_server.md 1"

[[table]]
name = "sv_lastping"
area = "engine server"
what = "last ping per client, u16 (SV_GetNetInfo 0x9DA40)"
base = 0x4E0448
stride = 2
count = 17
plan = "relocate"
layout = "verified"
source = "player_slots_engine_server.md 1"

[[table]]
name = "sv_lastloss"
area = "engine server"
what = "last packet loss per client, u8 (SV_GetNetInfo)"
base = 0x4E449C
stride = 1
count = 17
plan = "relocate"
layout = "verified"
source = "player_slots_engine_server.md 1"

[[table]]
name = "svs_clients"
area = "engine server"
what = "the client_t block (heap, malloc at 0xA1A2C): its size constants and stride"
base = 0x636CE4
stride = 0xC
count = 1                           # the pointer, maxclients and the limit
slack = 0
strides = [0x5010]
plan = "scales"
layout = "verified"
source = "player_slots_engine_server.md 1"

[[table]]
name = "client_voice_bits"
area = "engine server"
what = "voice listen bits in client_t at +0x5008 (64 bits with padding; 65 needs more)"
fields = [[0x5008, 0x5010]]
code = [[0xAB000, 0xAC500]]
plan = "field"
layout = "verified"
source = "player_slots_engine_server.md 1, 2"

