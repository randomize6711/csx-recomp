# checkpoint 2's review, function by function, of every function that computes a frame address (FINDINGS.md "Player
# slots, 65"): each frame multiply that feeds a player state is a [[change]], the two that share the frame pointer are
# hooks (0x23FAE, 0x32F81), the clears are hooks; the others touch only the frame's own fields or the packet entities
# (heap, frame + 0x1B44), which the trace's offsets mistook for player states. A frame function not in this list makes
# the audit report it again
