D3DDevice_SetTransform = ["eax", "edx"]
# D3DDevice_Swap(Flags): eax kept in ebx, 0 becomes 5 (0x309688); increments and returns device+0x2478; plain ret;
# callers 0xAF299, 0xAF555 xor eax, eax
D3DDevice_Swap = ["eax"]
# D3DResource_IsBusy(pResource): ecx is the resource ([ecx] common, [ecx+0x14] parent at 0x3080B0..0x3080C9); plain
# ret; caller 0xBE03E ecx = [ebp+0x410]
D3DResource_IsBusy = ["ecx"]
# D3D_InternalRelease(pResource): esi is the resource, 0x80000 taken off [esi] (0x307F80); plain ret; callers
# 0x305A94 and 0x305ABE load esi with the render target and depth surface
D3D_InternalRelease = ["esi"]
# D3D_MakeRequestedSpace(MinimumSpace, RequestedSpace): eax kept in ebx is the requested size (push + ebx checked at
# 0x30A1B5), the stack slot (ret 4) the minimum (0x30A1D4); callers push the smaller value (0x12996 push half,
# eax = full)
D3D_MakeRequestedSpace = ["stack", "eax"]
# D3DDevice_Reset(pPresentationParameters): ebx is the parameters — 0x3059DE..0x3059ED read [ebx] width, +4 height,
# +8 format, +0x28 flags, +0x2C refresh rate, 0x3059BB passes ebx to the frame buffer init; plain ret (0x3059D2,
# 0x305A29); caller 0x1084F6 lea ebx, [esp+0x20] on the parameters it built at 0x1084A3..0x1084DB
D3DDevice_Reset = ["ebx"]

