# argument locations in API order for functions a link time code generated library compiled with another
# convention: a register (eax ebx ecx edx esi edi ebp) or "stack" for the next stack slot, which the callee pops
[abi]
# Direct3D_CreateDevice(Adapter, DeviceType, hFocusWindow, BehaviorFlags, pPresentationParameters, ppDevice):
# 0x30A542 ands eax with 0x10 and ors it into device+8 (BehaviorFlags); ecx is kept in edi, 0x30A5AD stores the
# device 0x314B40 through it (ppDevice); the one stack slot (ret 4) goes to the device init 0x30B5D0 with the
# device (pPresentationParameters, built by the caller at 0x1084AB); the first three are never read
Direct3D_CreateDevice = ["none", "none", "none", "eax", "stack", "ecx"]
# proven in analysis/abi_5659.md (2026-10-19)
# CDevice_KickOff(this): 0x30A2C0 reads the device's flags [edx+8] and push pointer [edx]; callers 0x197481 and
# 0x1979C9 load edx from D3D_pDevice; plain ret
CDevice_KickOff = ["edx"]
# D3DDevice_DrawVertices(PrimitiveType, StartVertex, VertexCount): eax kept in edi is the count (batching 0x3083D1,
# (count-1)<<24 at 0x308451), ecx kept in ebx the start (0x308434), the one stack slot (ret 4) the primitive written
# after BEGIN_END at 0x308422; caller 0xAF547 pushes 8, eax = 4, ecx = 0
D3DDevice_DrawVertices = ["stack", "ecx", "eax"]
# D3DDevice_SelectVertexShader(Handle, Address): eax - 1 stored to device+0x794 (0x3073F7), ebx sent with method
# 0x1EA0 and stored to device+0x79C (0x307474, 0x30747C); plain ret; caller 0x307B07 eax = handle, ebx = 0
D3DDevice_SelectVertexShader = ["eax", "ebx"]
# D3DDevice_SetIndices(pIndexData, BaseVertexIndex): ebx AddRef'd (0x306621) and stored to device+0x7A0 (0x306661),
# the one stack slot (ret 4) stored to device+0x1C (0x30665E); caller 0x196648 ebx = buffer, push 0
D3DDevice_SetIndices = ["ebx", "stack"]
# D3DDevice_SetPixelShader(Handle): eax stored to device+0x784 at 0x304F84; plain ret; caller 0x15B9F loads eax only
D3DDevice_SetPixelShader = ["eax"]
# D3DDevice_SetPixelShaderConstant(Register, pConstantData, ConstantCount): ecx kept in edi is the register index
# (incremented 0x30542E), the stack slot (ret 4) the data read by movups 0x3051B4 and advanced by 16, eax the count
# (decremented 0x30542F); caller 0x15E2D pushes the data, eax = 1, ecx = 1
D3DDevice_SetPixelShaderConstant = ["ecx", "stack", "eax"]
# D3DDevice_SetShaderConstantMode(Mode): eax & 0x10 sets device flag 0x200, stored to device+0x1928 (0x307490..
# 0x3074B2); plain ret; caller 0x194F90 eax = 1
D3DDevice_SetShaderConstantMode = ["eax"]
# D3DDevice_SetStreamSource(StreamNumber, pStreamData, Stride): eax * 12 indexes the stream table (0x3070D6), ebx
# AddRef'd and stored at +8 (0x30711D), the stack slot (ret 4) stored at +0 (0x307117); caller 0xAF510 push 0x18,
# eax = 0, ebx = buffer
D3DDevice_SetStreamSource = ["eax", "ebx", "stack"]
# D3DDevice_BeginPushBuffer(pPushBuffer): edi (see the push buffer entries above)
D3DDevice_BeginPushBuffer = ["edi"]
# D3DDevice_SetTexture(Stage, pTexture): eax indexes device+0xF88 (0x306473, 0x3064A6), the stack slot (ret 4) is
# the texture, AddRef'd at 0x3064FF; caller 0x12A56 pushes the texture, eax = stage
D3DDevice_SetTexture = ["eax", "stack"]
# D3DDevice_SetTextureState_TexCoordIndex(Stage, Value): esi << 7 indexes the texture state table (0x30431D), the
